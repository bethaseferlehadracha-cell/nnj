<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#F4F7F3">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<link rel="icon" id="fav"><link rel="apple-touch-icon" id="fav2">
<title>משימות ממ"ח הכשרה</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Heebo:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%}

:root{
  --bg:#F4F7F3;--bg-2:#EAF1E8;--surface:#FFFFFF;--surface-2:#F6FAF5;--line:rgba(30,60,40,.09);--line-2:rgba(30,60,40,.16);
  --text:#14231A;--muted:#5E6F63;--faint:#9AAA9E;
  --primary:#24533B;--on-primary:#FFFFFF;--accent:#3E7A58;
  --glow:radial-gradient(55% 55% at 78% 18%,rgba(176,214,184,.55),transparent 70%);
  --nav:rgba(244,247,243,.78);--shadow:0 1px 2px rgba(20,50,30,.04),0 8px 24px rgba(20,50,30,.06);
  --logo-ring:rgba(36,83,59,.07);
  --p0:#7C8B80;--p1:#5B86B5;--p2:#3E8E68;--p3:#B98B45;--p4:#7E72C4;
  --tag-bg:#EEF4EC;
  --f-week:#3E8E68;--f-month:#5B86B5;--f-10:#B98B45;--f-3:#7E72C4;--f-once:#7C8B80;
}

html{overflow-x:hidden}
body{overflow-x:clip}
body{font-family:'Heebo',system-ui,sans-serif;background:var(--bg);color:var(--text);min-height:100vh;
  -webkit-font-smoothing:antialiased;font-feature-settings:"ss01";line-height:1.5}
button{-webkit-tap-highlight-color:transparent;touch-action:manipulation;font-family:inherit;cursor:pointer;border:0;background:none;color:inherit}
svg.i{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;flex-shrink:0}

/* NAV */
.nav{position:sticky;top:0;z-index:50;background:var(--nav);backdrop-filter:saturate(180%) blur(18px);-webkit-backdrop-filter:saturate(180%) blur(18px);border-bottom:1px solid var(--line)}
.nav-in{max-width:1120px;margin:0 auto;height:60px;padding:0 24px;display:flex;align-items:center;justify-content:space-between;gap:16px}
.brand{display:flex;align-items:center;gap:10px;font-weight:700;font-size:15px;letter-spacing:-.01em}
.brand img{width:30px;height:30px}
.brand span{color:var(--muted);font-weight:400}
.nav-actions{display:flex;gap:6px}
.nav-btn{display:inline-flex;align-items:center;gap:7px;height:36px;padding:0 14px;border-radius:999px;font-size:13.5px;font-weight:500;color:var(--muted);transition:background .15s,color .15s}
.nav-btn:hover,.nav-btn.on{background:var(--tag-bg);color:var(--text)}
.nav-btn svg.i{width:17px;height:17px}

.wrap{max-width:1120px;margin:0 auto;padding:0 24px}
.view{display:none}.view.on{display:block;animation:in .35s cubic-bezier(.2,.7,.2,1) both}
@keyframes in{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}

/* HOME */
.hero{position:relative;padding:72px 0 56px;display:grid;grid-template-columns:1.25fr 1fr;align-items:center;gap:48px}
.hero::before{content:'';position:absolute;inset:-40px -200px 0;background:var(--glow);pointer-events:none;z-index:-1}
.eyebrow{display:inline-flex;align-items:center;gap:8px;font-size:13px;font-weight:500;color:var(--muted);padding:6px 12px;border:1px solid var(--line-2);border-radius:999px;margin-bottom:22px}
.eyebrow i{width:6px;height:6px;border-radius:50%;background:var(--accent);font-style:normal}
.hero h1{font-size:clamp(40px,6vw,68px);font-weight:800;letter-spacing:-.035em;line-height:1.02}
.hero h1 b{display:block;color:var(--muted);font-weight:300}
.hero p{font-size:18px;color:var(--muted);max-width:520px;margin-top:20px;line-height:1.6}
.cta-row{display:flex;gap:10px;margin-top:32px;flex-wrap:wrap}
.btn{display:inline-flex;align-items:center;gap:10px;height:48px;padding:0 24px;border-radius:999px;font-size:15px;font-weight:600;transition:transform .15s,opacity .15s,background .15s}
.btn-primary{background:var(--primary);color:var(--on-primary)}
.btn-primary:hover{transform:translateY(-1px);opacity:.92}
.btn-ghost{border:1px solid var(--line-2);color:var(--text)}
.btn-ghost:hover{background:var(--tag-bg)}
.btn svg.i{width:18px;height:18px}
.logo-stage{display:flex;justify-content:center;align-items:center}
.logo-disc{width:min(340px,80vw);aspect-ratio:1;border-radius:50%;display:grid;place-items:center;background:var(--logo-ring);box-shadow:0 0 0 18px var(--logo-ring)}
.logo-disc img{width:86%;filter:drop-shadow(0 18px 40px rgba(0,0,0,.25))}

.stats{display:grid;grid-template-columns:repeat(3,1fr);border:1px solid var(--line);border-radius:20px;background:var(--surface);box-shadow:var(--shadow);overflow:hidden}
.stat{padding:22px 26px;border-inline-start:1px solid var(--line)}
.stat:first-child{border-inline-start:0}
.stat-n{font-size:34px;font-weight:700;letter-spacing:-.03em;line-height:1.1}
.stat-l{font-size:13px;color:var(--muted);margin-top:4px}

.sec-head{display:flex;align-items:end;justify-content:space-between;margin:64px 0 18px;gap:12px}
.sec-head h2{font-size:26px;font-weight:700;letter-spacing:-.02em}
.sec-head p{font-size:14px;color:var(--muted)}
.phase-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:12px;padding-bottom:72px}
.pcard{position:relative;text-align:right;background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:20px 18px 18px;min-height:190px;display:flex;flex-direction:column;box-shadow:var(--shadow);transition:transform .2s,border-color .2s}
.pcard:hover{transform:translateY(-3px);border-color:var(--line-2)}
.pcard-n{font-size:12px;font-weight:600;color:var(--pc);letter-spacing:.06em}
.pcard-ic{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;margin:14px 0 14px;color:var(--pc);background:color-mix(in srgb,var(--pc) 14%,transparent)}
.pcard h3{font-size:17px;font-weight:700;letter-spacing:-.01em}
.pcard p{font-size:13px;color:var(--muted);margin-top:4px;line-height:1.45}
.pcard-f{margin-top:auto;padding-top:14px;display:flex;justify-content:space-between;align-items:center;font-size:12.5px;color:var(--muted)}
.pcard-f svg.i{width:16px;height:16px;transition:transform .2s}
.pcard:hover .pcard-f svg.i{transform:translateX(-3px)}

/* PHASE VIEW */
.stepper{display:flex;gap:6px;margin:32px 0 8px;padding:6px;background:var(--surface);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow)}
.step{flex:1;display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:11px;font-size:13.5px;font-weight:500;color:var(--muted);transition:background .2s,color .2s;min-width:0}
.step:hover{background:var(--tag-bg);color:var(--text)}
.step-n{width:24px;height:24px;border-radius:50%;flex-shrink:0;display:grid;place-items:center;font-size:12px;font-weight:600;border:1.5px solid var(--line-2)}
.step span:last-child{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.step.done .step-n{background:var(--sc);border-color:var(--sc);color:var(--bg)}
.step.on{background:color-mix(in srgb,var(--sc) 14%,transparent);color:var(--text);font-weight:600}
.step.on .step-n{border-color:var(--sc);color:var(--sc)}
.progress{height:3px;border-radius:3px;background:var(--line);margin:0 6px 36px;overflow:hidden}
.progress div{height:100%;background:var(--primary);border-radius:3px;transition:width .5s cubic-bezier(.4,0,.2,1)}

.ph-head{display:flex;justify-content:space-between;align-items:end;gap:20px;margin-bottom:24px}
.ph-kicker{font-size:13px;font-weight:600;color:var(--pc);letter-spacing:.04em;margin-bottom:6px}
.ph-head h2{font-size:clamp(30px,4vw,42px);font-weight:800;letter-spacing:-.03em;line-height:1.1}
.ph-head p{color:var(--muted);font-size:16px;margin-top:6px}
.ph-count{font-size:13px;color:var(--muted);white-space:nowrap}

.tasks{display:grid;gap:10px}
.task{width:100%;display:grid;grid-template-columns:auto 1fr auto auto;align-items:center;gap:16px;text-align:right;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:16px 18px;box-shadow:var(--shadow);transition:border-color .15s,transform .15s;animation:in .35s both}
.task:hover{border-color:var(--line-2);transform:translateY(-1px)}
.task-ic{width:44px;height:44px;border-radius:12px;display:grid;place-items:center;background:var(--surface-2);border:1px solid var(--line);color:var(--text)}
.task-name{font-size:16px;font-weight:600;letter-spacing:-.01em}
.task-when{font-size:13px;color:var(--muted);margin-top:2px;display:flex;align-items:center;gap:6px}
.task-when svg.i{width:14px;height:14px}
.task-go{color:var(--faint)}
.freq{display:inline-flex;align-items:center;gap:7px;font-size:12.5px;font-weight:500;padding:5px 11px 5px 12px;border-radius:999px;background:var(--tag-bg);color:var(--text);white-space:nowrap}
.freq i{width:7px;height:7px;border-radius:50%;background:var(--fc)}

.pager{display:flex;justify-content:space-between;align-items:center;margin:28px 0 20px;gap:10px}
.pager .btn{height:44px;font-size:14px}
.pager-mid{font-size:13px;color:var(--muted)}
.legend{display:flex;flex-wrap:wrap;gap:8px 20px;padding:20px 0 60px;border-top:1px solid var(--line);font-size:12.5px;color:var(--muted)}
.legend span{display:inline-flex;align-items:center;gap:7px}
.legend i{width:7px;height:7px;border-radius:50%;background:var(--fc)}
.footer{text-align:center;font-size:12px;color:var(--faint);padding:0 0 28px}

/* DRAWER */
.scrim{position:fixed;inset:0;z-index:100;background:rgba(0,0,0,.45);backdrop-filter:blur(3px);opacity:0;pointer-events:none;transition:opacity .25s}
.scrim.on{opacity:1;pointer-events:auto}
.drawer{position:fixed;z-index:101;top:12px;bottom:12px;left:12px;width:min(460px,calc(100vw - 24px));background:var(--surface);border:1px solid var(--line-2);border-radius:22px;box-shadow:0 30px 80px rgba(0,0,0,.35);transform:translateX(calc(-100% - 40px));transition:transform .35s cubic-bezier(.2,.8,.2,1),visibility 0s .35s;visibility:hidden;display:flex;flex-direction:column;overflow:hidden}
.drawer.on{transform:none;visibility:visible;transition:transform .35s cubic-bezier(.2,.8,.2,1)}
.dr-handle{display:none;width:40px;height:5px;border-radius:3px;background:var(--line-2);margin:10px auto 0;flex-shrink:0}
.drawer.dragging{transition:none}
.dr-top{display:flex;justify-content:space-between;align-items:center;padding:18px 20px 0}
.dr-close{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;background:var(--tag-bg);color:var(--muted)}
.dr-close:hover{color:var(--text)}
.dr-body{padding:8px 28px 28px;overflow-y:auto}
.dr-ic{width:56px;height:56px;border-radius:16px;display:grid;place-items:center;background:var(--surface-2);border:1px solid var(--line);margin-bottom:18px}
.dr-ic svg.i{width:26px;height:26px}
.dr-body h3{font-size:26px;font-weight:800;letter-spacing:-.025em;line-height:1.15;margin-bottom:12px}
.dr-sec{margin-top:26px}
.dr-label{font-size:12px;font-weight:600;color:var(--muted);letter-spacing:.06em;margin-bottom:10px}
.dr-text{font-size:15px;line-height:1.75}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{font-size:12.5px;font-weight:500;padding:6px 12px;border-radius:999px;border:1px solid var(--line-2)}
.src{display:flex;align-items:center;gap:10px;padding:14px 16px;border-radius:14px;background:var(--surface-2);border:1px solid var(--line);font-size:14px;font-weight:500}
.src svg.i{color:var(--muted)}

@media(max-width:900px){
  .hero{grid-template-columns:1fr;padding:40px 0 36px;gap:32px;text-align:center}
  .hero p{margin-inline:auto}.cta-row{justify-content:center}
  .logo-stage{order:-1}.logo-disc{width:200px;box-shadow:0 0 0 12px var(--logo-ring)}
  .phase-grid{grid-template-columns:1fr 1fr}
  .step span:last-child{display:none}.step{justify-content:center}.step.on span:last-child{display:inline}
}
/* HOME: MY TASKS CARD */
.my-card{width:100%;margin-top:12px;display:flex;align-items:center;gap:18px;text-align:right;padding:18px 22px;border-radius:20px;background:var(--primary);color:var(--on-primary);box-shadow:0 10px 30px rgba(36,83,59,.22);transition:transform .2s}
.my-card:hover{transform:translateY(-2px)}
.mc-ic{width:52px;height:52px;border-radius:14px;display:grid;place-items:center;background:rgba(255,255,255,.14)}
.mc-ic svg.i{width:26px;height:26px}
.mc-ring{position:relative;width:56px;height:56px;flex-shrink:0}
.mc-ring b{position:absolute;inset:0;display:grid;place-items:center;font-size:13px;font-weight:700}
.mc-ring .ring-bg{stroke:rgba(255,255,255,.2)}.mc-ring .ring-fg{stroke:#fff}
.mc-t{flex:1;min-width:0;display:flex;flex-direction:column}
.mc-t b{font-size:19px;font-weight:700;letter-spacing:-.01em}
.mc-t span{font-size:13.5px;opacity:.8}
.mc-go{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;background:rgba(255,255,255,.14);flex-shrink:0}

/* RING */
.ring{width:100%;height:100%;transform:rotate(-90deg)}
.ring circle{fill:none;stroke-width:7}
.ring-bg{stroke:var(--line)}
.ring-fg{stroke:var(--f-week);stroke-linecap:round;transition:stroke-dashoffset .6s cubic-bezier(.4,0,.2,1)}

/* MY TASKS */
.my-head{display:flex;justify-content:space-between;align-items:end;gap:16px;margin:36px 0 18px}
.my-head h2{font-size:clamp(28px,4vw,40px);font-weight:800;letter-spacing:-.03em;line-height:1.1}
.my-user{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.cloud{display:inline-flex;align-items:center;gap:7px;font-size:12.5px;font-weight:500;padding:6px 12px;border-radius:999px;background:var(--tag-bg);color:var(--muted)}
.cloud i{width:7px;height:7px;border-radius:50%;background:var(--faint)}
.cloud.on{color:var(--primary)}.cloud.on i{background:#3E9B6C;box-shadow:0 0 0 3px rgba(62,155,108,.18)}
.cloud.connecting i{background:var(--f-10);animation:pulse 1s infinite alternate}
.cloud.local{background:#FBF3E6;color:#8A5A14}.cloud.local i{background:#D89A3A}
@keyframes pulse{to{opacity:.3}}
.link-btn{display:inline-flex;align-items:center;gap:6px;font-size:13.5px;font-weight:500;color:var(--muted);text-decoration:underline;text-underline-offset:3px;text-decoration-color:var(--line-2)}
.link-btn:hover{color:var(--text)}
.link-btn svg.i{width:16px;height:16px}
.link-btn.danger{color:#B4534A;text-decoration:none}

.sum{display:flex;align-items:center;gap:22px;padding:20px 24px;background:var(--surface);border:1px solid var(--line);border-radius:20px;box-shadow:var(--shadow)}
.sum-ring{position:relative;width:84px;height:84px;flex-shrink:0}
.sum-ring b{position:absolute;inset:0;display:grid;place-items:center;font-size:20px;font-weight:800;letter-spacing:-.02em}
.sum-big{font-size:22px;font-weight:700;letter-spacing:-.02em}
.sum-row{display:flex;flex-wrap:wrap;gap:6px 18px;margin-top:6px}
.k{display:inline-flex;align-items:center;gap:7px;font-size:13.5px;color:var(--muted)}
.k i{width:8px;height:8px;border-radius:50%}
.k.ok i{background:#3E9B6C}.k.no i{background:#C9665C}.k.op i{background:var(--line-2)}

.toolbar{display:flex;justify-content:space-between;align-items:center;gap:12px;margin:22px 0 14px}
.filters{display:flex;gap:4px;padding:4px;background:var(--surface);border:1px solid var(--line);border-radius:999px;overflow-x:auto;scrollbar-width:none}
.filters::-webkit-scrollbar{display:none}
.fl{display:inline-flex;align-items:center;gap:7px;height:36px;padding:0 14px;border-radius:999px;font-size:13.5px;font-weight:500;color:var(--muted);white-space:nowrap;transition:background .15s,color .15s}
.fl span{font-size:11.5px;font-weight:600;min-width:20px;height:20px;padding:0 6px;border-radius:999px;display:grid;place-items:center;background:var(--tag-bg);color:var(--muted)}
.fl.on{background:var(--primary);color:var(--on-primary)}
.fl.on span{background:rgba(255,255,255,.18);color:#fff}
.add-desk{height:44px;font-size:14px;padding:0 20px}

.grps{display:grid;gap:12px}
.grp{background:var(--surface);border:1px solid var(--line);border-radius:20px;box-shadow:var(--shadow);overflow:hidden}
.grp-h{width:100%;display:grid;grid-template-columns:auto 1fr auto 120px auto;align-items:center;gap:14px;padding:16px 18px;text-align:right}
.grp-ic{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;color:var(--pc);background:color-mix(in srgb,var(--pc) 14%,transparent)}
.grp-t{display:flex;flex-direction:column;min-width:0}
.grp-t b{font-size:17px;font-weight:700}
.grp-t small{font-size:12.5px;color:var(--muted)}
.grp-n{font-size:13px;font-weight:600;color:var(--muted);font-variant-numeric:tabular-nums}
.grp-bar{height:6px;border-radius:6px;background:var(--line);overflow:hidden}
.grp-bar i{display:block;height:100%;border-radius:6px;background:var(--pc);transition:width .5s}
.grp-chev{color:var(--faint);transition:transform .25s}
.grp.col .grp-chev{transform:rotate(-90deg)}
.grp.col .grp-list{display:none}
.grp-list{border-top:1px solid var(--line)}

.row{display:flex;align-items:center;gap:10px;padding:6px 10px 6px 14px;border-bottom:1px solid var(--line);transition:background .2s}
.row-main{flex:1;min-width:0;display:flex;flex-direction:column;gap:3px;text-align:right;padding:10px 8px}
.row-name{font-size:15.5px;font-weight:600;display:flex;align-items:center;gap:8px;flex-wrap:wrap;transition:color .2s}
.row-meta{display:flex;align-items:center;gap:6px 12px;flex-wrap:wrap;font-size:12.5px;color:var(--muted)}
.freq-mini{display:inline-flex;align-items:center;gap:6px}
.freq-mini i{width:6px;height:6px;border-radius:50%;background:var(--fc)}
.row-note{display:inline-flex;align-items:center;gap:5px;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--text);opacity:.75}
.row-note svg.i{width:13px;height:13px}
.mine{font-size:11px;font-weight:600;padding:2px 8px;border-radius:999px;background:#E9E5FA;color:#5B4FB0}
.row.st-done .row-name{color:var(--muted)}
.row.st-done .row-name::before{content:'';width:6px;height:6px;border-radius:50%;background:#3E9B6C;flex-shrink:0}
.row.st-no .row-name::before{content:'';width:6px;height:6px;border-radius:50%;background:#C9665C;flex-shrink:0}

.seg{display:inline-flex;flex-shrink:0;gap:2px;padding:3px;border:1px solid var(--line-2);border-radius:999px;background:var(--surface)}
.sb{display:inline-flex;align-items:center;gap:5px;height:30px;padding:0 12px;border-radius:999px;font-size:12.5px;font-weight:500;color:var(--muted);white-space:nowrap;transition:background .18s,color .18s}
.sb svg.i{width:14px;height:14px;stroke-width:2}
.sb:hover{color:var(--text);background:var(--surface-2)}
.sb.ok.on{background:#E4F2EA;color:#1F7A4D}
.sb.no.on{background:#F7E8E5;color:#A3483F}
.row-add{width:100%;display:flex;align-items:center;justify-content:center;gap:8px;padding:14px;font-size:13.5px;font-weight:500;color:var(--muted)}
.row-add:hover{color:var(--primary);background:var(--surface-2)}
.row-add svg.i{width:16px;height:16px}
.none{text-align:center;color:var(--muted);padding:40px 0}
.my-foot{display:flex;justify-content:center;padding:28px 0 60px}

.empty{max-width:420px;margin:72px auto;text-align:center;display:flex;flex-direction:column;align-items:center;gap:10px}
.empty h3{font-size:26px;font-weight:800}
.empty p{color:var(--muted);margin-bottom:10px}

/* SHEET FORMS */
.dr-phase{font-size:13px;font-weight:600;color:var(--pc);margin-bottom:6px;display:flex;align-items:center;gap:6px}
.muted{color:var(--muted)}
.field{width:100%;font:inherit;font-size:16px;color:var(--text);background:var(--surface-2);border:1.5px solid var(--line-2);border-radius:14px;padding:13px 14px;resize:vertical;outline:none;transition:border-color .15s,box-shadow .15s}
.field:focus{border-color:var(--accent);box-shadow:0 0 0 4px rgba(62,122,88,.12)}
.status-pick{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.spk{display:flex;align-items:center;justify-content:center;gap:8px;height:48px;border-radius:14px;border:1px solid var(--line-2);font-size:15px;font-weight:500;color:var(--muted);transition:all .18s}
.spk svg.i{width:17px;height:17px;stroke-width:2}
.spk:hover{background:var(--surface-2);color:var(--text)}
.spk.ok.on{background:#E4F2EA;border-color:#B9DCC8;color:#1F7A4D}
.spk.no.on{background:#F7E8E5;border-color:#E9C3BD;color:#A3483F}
.phase-pick{display:flex;flex-wrap:wrap;gap:6px}
.pp{height:40px;padding:0 14px;border-radius:999px;border:1.5px solid var(--line-2);font-size:14px;font-weight:500;color:var(--muted)}
.pp-out{display:inline-flex;align-items:center;gap:6px}
.pp-out svg.i{width:16px;height:16px}
.pp.on{border-color:var(--pc);background:color-mix(in srgb,var(--pc) 14%,transparent);color:var(--text);font-weight:600}
.btn-block{width:100%;justify-content:center;margin-top:24px;height:52px;font-size:16px}
.btn-danger{border:1.5px solid rgba(210,103,92,.35);color:#B4534A}
.btn-danger:hover{background:rgba(210,103,92,.08)}
.dr-actions{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:26px}
.dr-actions .btn{justify-content:center}
.form-err{color:#B4534A;font-size:13.5px;min-height:18px;margin-top:10px}
.chip-btn{cursor:pointer;background:var(--surface-2)}
.chip-btn:hover{border-color:var(--accent)}

/* FAB + TOAST */
.fab{position:fixed;z-index:60;left:0;right:0;bottom:0;display:none;padding:10px 16px calc(10px + env(safe-area-inset-bottom));background:var(--nav);backdrop-filter:saturate(180%) blur(18px);-webkit-backdrop-filter:saturate(180%) blur(18px);border-top:1px solid var(--line)}
.fab .btn{width:100%;justify-content:center;height:52px;font-size:16px;box-shadow:0 8px 20px rgba(36,83,59,.25)}
.toast{position:fixed;z-index:200;left:50%;bottom:calc(28px + env(safe-area-inset-bottom));transform:translate(-50%,20px);opacity:0;pointer-events:none;background:#14231A;color:#fff;font-size:14px;font-weight:500;padding:12px 20px;border-radius:999px;transition:all .25s;box-shadow:0 10px 30px rgba(0,0,0,.2)}
.toast.on{opacity:1;transform:translate(-50%,0)}

@media(max-width:560px){
  .my-card{padding:14px 16px;gap:14px;border-radius:18px}
  .mc-t b{font-size:17px}.mc-t span{font-size:12.5px}
  .mc-go{display:none}
  .my-head{flex-direction:column;align-items:start;gap:10px;margin:22px 0 14px}
  .sum{padding:16px;gap:16px;border-radius:18px}
  .sum-ring{width:68px;height:68px}.sum-ring b{font-size:16px}
  .sum-big{font-size:18px}
  .k{font-size:12.5px}
  .toolbar{margin:16px -16px 12px;padding:0 16px}
  .filters{flex:1}
  .add-desk{display:none}
  .fab.on{display:block}
  .fl{padding:0 10px;gap:5px;font-size:13px}
  .fl span{min-width:18px;height:18px;font-size:11px;padding:0 5px}
  .grp{border-radius:18px}
  .grp-h{grid-template-columns:auto 1fr auto auto;gap:12px;padding:14px}
  .grp-bar{grid-column:1/-1;grid-row:2}
  .grp-t small{display:none}
  .row{padding:4px 8px 4px 10px}
  .row-main{padding:10px 4px}
  .row-name{font-size:15px}
  .seg{padding:3px}
  .sb{height:34px;padding:0 11px}
  .sb svg.i{display:none}
  .my-foot{padding-bottom:30px}
  #my{padding-bottom:calc(76px + env(safe-area-inset-bottom))}
  .toast{bottom:calc(96px + env(safe-area-inset-bottom))}
}

@media(max-width:560px){
  .wrap,.nav-in{padding-inline:16px}
  .nav-in{height:56px}
  .nav{padding-top:env(safe-area-inset-top)}
  .brand{font-size:15px}.brand span{display:none}
  .nav-btn{width:40px;height:40px;padding:0;justify-content:center}
  .nav-btn .lbl{display:none}.nav-btn svg.i{width:19px;height:19px}

  .hero{padding:28px 0 24px;gap:22px}
  .logo-disc{width:148px;box-shadow:0 0 0 9px var(--logo-ring)}
  .eyebrow{margin-bottom:14px;font-size:12px}
  .hero h1{font-size:40px}
  .hero p{font-size:15.5px;margin-top:12px}
  .cta-row{flex-direction:column;margin-top:22px;gap:8px}
  .cta-row .btn{width:100%;justify-content:center;height:52px;font-size:16px}

  .stats{border-radius:18px}
  .stat{padding:14px 16px}
  .stat-n{font-size:26px}.stat-l{font-size:12px;margin-top:2px}

  .sec-head{margin:32px 0 12px}
  .sec-head h2{font-size:21px}.sec-head p{display:none}
  .phase-grid{grid-template-columns:1fr;gap:8px;padding-bottom:36px}
  .pcard{flex-direction:row;align-items:center;gap:14px;min-height:0;padding:14px 16px;border-radius:16px}
  .pcard-n{display:none}
  .pcard-ic{margin:0;width:44px;height:44px;flex-shrink:0}
  .pcard-t{flex:1;min-width:0}
  .pcard h3{font-size:16px}.pcard p{font-size:12.5px;margin-top:1px}
  .pcard-f{margin:0;padding:0;flex-direction:column;align-items:flex-end;gap:2px;font-size:11.5px;white-space:nowrap}

  .stepper{position:sticky;top:calc(56px + env(safe-area-inset-top));z-index:40;margin:0 -16px;padding:10px 16px;border-radius:0;border-inline:0;border-top:0;box-shadow:none;background:var(--nav);backdrop-filter:saturate(180%) blur(18px);-webkit-backdrop-filter:saturate(180%) blur(18px);overflow-x:auto;scrollbar-width:none;scroll-snap-type:x proximity}
  .stepper::-webkit-scrollbar{display:none}
  .step{flex:0 0 auto;justify-content:flex-start;padding:8px 14px 8px 10px;border-radius:999px;background:var(--surface);border:1px solid var(--line);scroll-snap-align:center}
  .step span:last-child,.step.on span:last-child{display:inline}
  .step.on{border-color:transparent}
  .progress{margin:0 0 22px;border-radius:0}

  .ph-head{flex-direction:column;align-items:start;gap:6px;margin-bottom:16px}
  .ph-head h2{font-size:30px}.ph-head p{font-size:14.5px;margin-top:2px}
  .ph-count{font-size:12px}
  .tasks{gap:8px}
  .task{grid-template-columns:auto 1fr auto;gap:4px 12px;padding:14px;border-radius:16px}
  .task-ic{grid-row:1/3;align-self:start;width:42px;height:42px}
  .task-name{font-size:15.5px}
  .task-when{font-size:12.5px}
  .task .freq{grid-column:2;grid-row:2;justify-self:start;margin-top:6px;font-size:12px}
  .task-go{grid-column:3;grid-row:1/3}

  .pager{position:sticky;bottom:0;z-index:30;margin:16px -16px 0;padding:10px 16px calc(10px + env(safe-area-inset-bottom));background:var(--nav);backdrop-filter:saturate(180%) blur(18px);-webkit-backdrop-filter:saturate(180%) blur(18px);border-top:1px solid var(--line)}
  .pager>*{flex:1;min-width:0}
  .pager .btn{width:100%;justify-content:center;height:48px;padding:0 14px}
  .pager .btn .lbl{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .pager-mid{display:none}
  .legend{padding:18px 0 24px;gap:8px 14px;font-size:12px}
  .footer{padding-bottom:calc(20px + env(safe-area-inset-bottom))}

  .drawer{top:auto;left:0;right:0;bottom:0;width:100%;max-height:90vh;border-radius:24px 24px 0 0;border-bottom:0;transform:translateY(calc(100% + 30px))}
  .dr-handle{display:block}
  .dr-top{padding:6px 16px 0}
  .dr-body{padding:0 20px calc(28px + env(safe-area-inset-bottom))}
  .dr-ic{width:48px;height:48px;border-radius:14px;margin-bottom:14px}
  .dr-body h3{font-size:23px;margin-bottom:10px}
  .dr-sec{margin-top:22px}
}
@media(hover:none){
  .pcard:hover,.task:hover,.btn-primary:hover{transform:none}
  .pcard:active,.task:active,.btn:active,.step:active{transform:scale(.98)}
  .pcard,.task,.btn,.step{transition:transform .12s,background .15s}
}

/* CENTERED PERSONAL-AREA DIALOG */
.drawer.center,.drawer.center.on{top:50%;left:50%;right:auto;bottom:auto;width:min(420px,calc(100vw - 32px));max-height:calc(100vh - 32px);border-radius:24px;border:1px solid var(--line-2)}
.drawer.center{transform:translate(-50%,-46%) scale(.97);opacity:0;transition:transform .3s cubic-bezier(.2,.8,.2,1),opacity .25s,visibility 0s .3s}
.drawer.center.on{transform:translate(-50%,-50%);opacity:1;transition:transform .3s cubic-bezier(.2,.8,.2,1),opacity .25s}
.drawer.center .dr-handle{display:none}
.drawer.center .dr-body{padding:0 28px 28px}
.auth{display:flex;flex-direction:column;align-items:center;text-align:center}
.auth-ic{width:64px;height:64px;border-radius:50%;display:grid;place-items:center;background:var(--tag-bg);color:var(--primary);margin-bottom:14px}
.auth-ic svg.i{width:28px;height:28px}
.auth h3{font-size:26px;font-weight:800;letter-spacing:-.02em;margin-bottom:6px}
.auth .dr-text{font-size:14.5px;margin-bottom:22px;max-width:300px}
.auth .dr-label{align-self:stretch;text-align:center}
.auth .field{text-align:center;font-size:17px}
.auth-recent{justify-content:center;margin-top:12px}
.auth .form-err{text-align:center}
.auth .btn-block{margin-top:14px}
@media(max-width:560px){
  .drawer.center,.drawer.center.on{top:50%;left:50%;right:auto;bottom:auto;width:calc(100vw - 32px);border-radius:24px;border-bottom:1px solid var(--line-2)}
  .drawer.center .dr-body{padding:0 20px 24px}
}

<body>

<div class="fab" id="fab"><button class="btn btn-primary" onclick="openSheet({type:'add'})"><svg class="i"><use href="#ic-plus"/></svg>משימה חדשה</button></div>

// ─── STATE ─────────────────────────────────────────────────────────────
const totalWeeks=13, prepWeeks=3;
let current=0;
const ic=(n)=>`<svg class="i"><use href="#ic-${n}"/></svg>`;
const freqOf=(t)=>({text:t.freqText||F[t.f].t,c:F[t.f].c});

// ─── HOME ──────────────────────────────────────────────────────────────
function renderHome(){
  const nTasks=phases.reduce((s,p)=>s+p.tasks.length,0);
  const nSources=new Set(phases.flatMap(p=>p.tasks.map(t=>t.source))).size;
  document.getElementById('stats').innerHTML=[
    [phases.length,'שלבי הכשרה'],[nTasks,'משימות בציר'],[nSources,'נהלים מקושרים']
  ].map(([n,l])=>`<div class="stat"><div class="stat-n">${n}</div><div class="stat-l">${l}</div></div>`).join('');
  document.getElementById('phase-grid').innerHTML=phases.map((p,i)=>`
    <button class="pcard" style="--pc:${p.c}" onclick="go(${i})">
      <div class="pcard-n">שלב ${String(i+1).padStart(2,'0')}</div>
      <div class="pcard-ic">${ic(p.icon)}</div>
      <div class="pcard-t"><h3>${p.title}</h3><p>${p.desc}</p></div>
      <div class="pcard-f"><span>${p.tasks.length} משימות</span>${ic('arrow')}</div>
    </button>`).join('');
}

// ─── TIMELINE ──────────────────────────────────────────────────────────
function renderTimeline(){
  document.getElementById('stepper').innerHTML=phases.map((p,i)=>`
    <button class="step ${i===current?'on':''} ${i<current?'done':''}" style="--sc:${p.c}" onclick="go(${i})">
      <span class="step-n">${i<current?'✓':i+1}</span><span>${p.title}</span>
    </button>`).join('');
  document.getElementById('prog').style.width=((current+1)/phases.length*100)+'%';

  const p=phases[current];
  const tasks=p.tasks.map((t,ti)=>{
    const w=t.weeksFn(totalWeeks,prepWeeks);
    const when=w.length>1?`${w.slice(0,2).join(', ')}${w.length>2?' ועוד':''}`:w[0];
    const fq=freqOf(t);
    return `<button class="task" style="animation-delay:${ti*.05}s" onclick="openDrawer(${current},${ti})">
      <div class="task-ic">${ic(t.icon)}</div>
      <div><div class="task-name">${t.name}</div><div class="task-when">${ic('cal')}${when}</div></div>
      <span class="freq" style="--fc:${fq.c}"><i></i>${fq.text}</span>
      <span class="task-go">${ic('chev')}</span>
    </button>`;
  }).join('');
  document.getElementById('phase').innerHTML=`
    <div class="ph-head" style="--pc:${p.c}">
      <div><div class="ph-kicker">שלב ${current+1} מתוך ${phases.length}</div><h2>${p.title}</h2><p>${p.desc}</p></div>
      <div class="ph-count">${p.tasks.length} משימות · לחץ על משימה לפרטים</div>
    </div>
    <div class="tasks">${tasks}</div>`;

  const prev=current>0?`<button class="btn btn-ghost" onclick="go(${current-1})">${ic('arrow-r')}<span class="lbl">${phases[current-1].title}</span></button>`:'<span></span>';
  const next=current<phases.length-1?`<button class="btn btn-primary" onclick="go(${current+1})"><span class="lbl">${phases[current+1].title}</span>${ic('arrow')}</button>`:`<button class="btn btn-primary" onclick="showHome()">חזרה לבית${ic('home')}</button>`;
  document.getElementById('pager').innerHTML=`${prev}<span class="pager-mid">${current+1} מתוך ${phases.length}</span>${next}`;
  document.getElementById('legend').innerHTML=Object.values(F).map(f=>`<span style="--fc:${f.c}"><i></i>${f.t}</span>`).join('');
}

function setView(v){
  ['home','timeline','my'].forEach(id=>document.getElementById(id).classList.toggle('on',(id==='timeline'?'tl':id)===v));
  document.getElementById('nb-home').classList.toggle('on',v==='home');
  document.getElementById('nb-tl').classList.toggle('on',v==='tl');
  document.getElementById('nb-my').classList.toggle('on',v==='my');
  document.getElementById('fab').classList.toggle('on',v==='my'&&!!user);
  window.scrollTo({top:0,behavior:'instant'});
}
function centerStep(){
  const on=document.querySelector('.step.on');
  if(!on)return;
  const sp=on.parentElement;
  if(sp.scrollWidth<=sp.clientWidth)return;
  const r=on.getBoundingClientRect(), pr=sp.getBoundingClientRect();
  sp.scrollBy({left:(r.left+r.width/2)-(pr.left+pr.width/2),behavior:'smooth'});
}
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

// ─── NAVIGATION (works with the phone's back button) ───────────────────
// state: {v:'home'} | {v:'tl',i} | {v:'my'}; an open sheet adds {dr:{...}}
let viewNow='home';
function apply(st){
  if(st.v==='tl'){
    const changed=viewNow!=='tl'||current!==st.i;
    current=st.i; renderTimeline();
    if(changed){setView('tl');requestAnimationFrame(centerStep);}
  }else if(st.v==='my'){
    renderMy(); if(viewNow!=='my')setView('my');
  }else if(viewNow!=='home'){renderHome();setView('home');}
  viewNow=st.v||'home';
  if(st.dr)fillSheet(st.dr); else hideDrawer();
}
function nav(st){try{history.pushState(st,'');}catch(e){} apply(st);}
function showHome(){nav({v:'home'});}
function go(i){nav({v:'tl',i});}
function showMy(){nav(user?{v:'my'}:{v:'my',dr:{type:'name'}});}
window.addEventListener('popstate',e=>apply(e.state||{v:'home'}));

// ─── SHEET ─────────────────────────────────────────────────────────────
function openSheet(dr){nav({v:viewNow,i:current,dr});}
function openDrawer(pi,ti){openSheet({type:'info',pi,ti});}
function closeDrawer(){
  if(history.state&&history.state.dr)history.back(); else hideDrawer();
}
function showSheet(html,center){
  const d0=document.getElementById('drawer');
  if(d0.classList.contains('center')!==!!center&&!d0.classList.contains('on')){d0.style.transition='none';d0.classList.toggle('center',!!center);void d0.offsetWidth;d0.style.transition='';}
  else d0.classList.toggle('center',!!center);
  const body=document.getElementById('dr-body');
  body.innerHTML=html; body.scrollTop=0;
  document.getElementById('scrim').classList.add('on');
  const d=document.getElementById('drawer'); d.style.transform=''; d.classList.add('on');
  document.body.style.overflow='hidden';
}
function hideDrawer(){
  document.getElementById('scrim').classList.remove('on');
  const d=document.getElementById('drawer'); d.style.transform=''; d.classList.remove('on');
  document.body.style.overflow='';
}
function infoBlocks(t){
  const w=t.weeksFn(totalWeeks,prepWeeks);
  return `<div class="dr-sec"><div class="dr-label">מה זה?</div><div class="dr-text">${t.desc}</div></div>
    <div class="dr-sec"><div class="dr-label">מתי לבצע</div><div class="chips">${w.map(x=>`<span class="chip">${x}</span>`).join('')}</div></div>
    <div class="dr-sec"><div class="dr-label">מקור</div><div class="src">${ic('book')}${t.source}</div></div>`;
}
function fillSheet(dr){
  if(dr.type==='info'){
    const t=phases[dr.pi].tasks[dr.ti], fq=freqOf(t);
    showSheet(`<div class="dr-ic">${ic(t.icon)}</div><h3>${t.name}</h3>
      <span class="freq" style="--fc:${fq.c}"><i></i>${fq.text}</span>${infoBlocks(t)}`);
  }else if(dr.type==='task'){
    const it=itemByKey(dr.key); if(!it){hideDrawer();return;}
    const st=my.status[it.key]||'';
    const p=phaseMeta(it.pi);
    showSheet(`<div class="dr-ic">${ic(it.custom?'doc':it.t.icon)}</div>
      <div class="dr-phase" style="--pc:${p.c}">${p.title}${it.custom?' · <span class="mine">שלי</span>':''}</div>
      <h3>${esc(it.name)}</h3>
      <div class="dr-sec"><div class="dr-label">סטטוס</div>
        <div class="status-pick" id="sp">
          <button class="spk ok ${st==='done'?'on':''}" onclick="sheetStatus('${it.key}','done')">${ic('check')}בוצע</button>
          <button class="spk no ${st==='no'?'on':''}" onclick="sheetStatus('${it.key}','no')">${ic('x')}לא בוצע</button>
        </div></div>
      <div class="dr-sec"><div class="dr-label">הערה</div>
        <textarea class="field" id="note" rows="3" placeholder="לדוגמה: נדחה לשבוע הבא" oninput="noteInput('${it.key}',this.value)">${esc(my.notes[it.key]||'')}</textarea></div>
      ${it.custom?`<div class="dr-actions"><button class="btn btn-ghost" onclick="openSheet({type:'edit',id:'${it.id}'})">${ic('edit')}עריכה</button><button class="btn btn-danger" onclick="delCustom('${it.id}')">${ic('trash')}מחיקה</button></div>`:infoBlocks(it.t)}`);
  }else if(dr.type==='add'||dr.type==='edit'){
    const c=dr.type==='edit'?my.custom.find(x=>x.id===dr.id):null;
    if(dr.type==='edit'&&!c){hideDrawer();return;}
    const sel=c?(c.pi>=0?c.pi:-1):(dr.pi!=null?dr.pi:-1);
    showSheet(`<div class="dr-ic">${ic(c?'edit':'plus')}</div><h3>${c?'עריכת משימה':'משימה חדשה'}</h3>
      <div class="dr-sec"><div class="dr-label">שם המשימה</div><input class="field" id="f-name" maxlength="80" placeholder="מה צריך לבצע?" value="${c?esc(c.name):''}"></div>
      <div class="dr-sec"><div class="dr-label">שיוך (לא חובה)</div><div class="phase-pick" id="f-phase">
        <button class="pp pp-out ${sel<0?'on':''}" style="--pc:${OUTSIDE.c}" data-i="-1" onclick="pickPhase(this)">${ic('inbox')}מחוץ להכשרה</button>
        ${phases.map((p,i)=>`<button class="pp ${i===sel?'on':''}" style="--pc:${p.c}" data-i="${i}" onclick="pickPhase(this)">${p.title}</button>`).join('')}
      </div></div>
      <div class="dr-sec"><div class="dr-label">הערה (לא חובה)</div><textarea class="field" id="f-note" rows="3">${c?esc(my.notes['c-'+c.id]||''):''}</textarea></div>
      <div class="form-err" id="f-err"></div>
      <button class="btn btn-primary btn-block" onclick="saveCustom(${c?`'${c.id}'`:'null'})">${c?'שמירת שינויים':'הוספת המשימה'}</button>`);
    setTimeout(()=>{const f=document.getElementById('f-name'); if(f&&window.innerWidth>560)f.focus();},350);
  }else if(dr.type==='name'){
    const recent=lsGet('mm_recent',[]);
    showSheet(`<div class="auth">
      <div class="auth-ic">${ic('user')}</div>
      <h3>אזור אישי</h3>
      <p class="dr-text muted">הסימונים נשמרים בענן לפי השם, כך שאפשר להמשיך מכל מכשיר.</p>
      <label class="dr-label" for="f-user">שם</label>
      <input class="field" id="f-user" maxlength="40" placeholder="שם מלא" value="${esc(user)}" onkeydown="if(event.key==='Enter')setUser()">
      ${recent.length?`<div class="chips auth-recent">${recent.map(n=>`<button class="chip chip-btn" onclick="setUser(this.textContent)">${esc(n)}</button>`).join('')}</div>`:''}
      <div class="form-err" id="u-err"></div>
      <button class="btn btn-primary btn-block" onclick="setUser()">כניסה</button>
    </div>`,true);
    setTimeout(()=>{const f=document.getElementById('f-user'); if(f&&window.innerWidth>560)f.focus();},350);
  }
}
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&document.getElementById('drawer').classList.contains('on'))closeDrawer();});

// swipe the sheet down to close (phone)
(function(){
  const d=document.getElementById('drawer'), body=document.getElementById('dr-body');
  let y0=null, dy=0;
  d.addEventListener('touchstart',e=>{
    if(window.innerWidth>560||d.classList.contains('center'))return;
    if(e.target.closest('input,textarea'))return;
    if(body.contains(e.target)&&body.scrollTop>0)return;
    y0=e.touches[0].clientY; dy=0; d.classList.add('dragging');
  },{passive:true});
  d.addEventListener('touchmove',e=>{
    if(y0===null)return;
    dy=Math.max(0,e.touches[0].clientY-y0);
    d.style.transform=`translateY(${dy}px)`;
  },{passive:true});
  d.addEventListener('touchend',()=>{
    if(y0===null)return;
    d.classList.remove('dragging'); y0=null;
    if(dy>90)closeDrawer(); else d.style.transform='';
  });
})();

function lsGet(k,def){try{const v=localStorage.getItem(k);return v==null?def:JSON.parse(v);}catch(e){return def;}}
function lsSet(k,v){try{localStorage.setItem(k,JSON.stringify(v));}catch(e){}}
let user=lsGet('mm_user','');
let my=loadLocal();
let filter='all';
const collapsed=new Set();
function blank(){return {name:user,status:{},notes:{},custom:[],updatedAt:0};}
function normalize(d){const b=blank();return {name:d.name||user,status:d.status||{},notes:d.notes||{},custom:Array.isArray(d.custom)?d.custom:[],updatedAt:d.updatedAt||0};}
function loadLocal(){return user?normalize(lsGet('mm_data_'+user,blank())):blank();}
const OUTSIDE={title:'מחוץ להכשרה',icon:'inbox',c:'#6E7F96',desc:'משימות אישיות שאינן חלק משלבי ההכשרה'};
const phaseMeta=pi=>pi<0?OUTSIDE:phases[pi];
function items(){
  const out=[];
  phases.forEach((p,pi)=>{
    p.tasks.forEach((t,ti)=>out.push({key:`b-${pi}-${ti}`,pi,t,name:t.name,custom:false}));
    my.custom.filter(c=>c.pi===pi).forEach(c=>out.push({key:'c-'+c.id,id:c.id,pi,name:c.name,custom:true}));
  });
  my.custom.filter(c=>!(c.pi>=0&&c.pi<phases.length)).forEach(c=>out.push({key:'c-'+c.id,id:c.id,pi:-1,name:c.name,custom:true}));
  return out;
}
function itemByKey(k){return items().find(x=>x.key===k);}
function counts(list){
  const c={total:list.length,done:0,no:0};
  list.forEach(x=>{const s=my.status[x.key];if(s==='done')c.done++;else if(s==='no')c.no++;});
  c.open=c.total-c.done-c.no; return c;
}

let saveT=null;
function persist(immediate){
  my.updatedAt=Date.now(); my.name=user;
  lsSet('mm_data_'+user,my);
  clearTimeout(saveT);
  saveT=setTimeout(pushCloud,immediate?0:600);
}
function setStatus(key,s){
  my.status[key]=my.status[key]===s?undefined:s;
  if(!my.status[key])delete my.status[key];
  persist(true); renderMy();
}
function sheetStatus(key,s){
  setStatus(key,s);
  const st=my.status[key]||'';
  document.querySelectorAll('#sp .spk').forEach(b=>b.classList.toggle('on',(b.classList.contains('ok')&&st==='done')||(b.classList.contains('no')&&st==='no')));
}
function noteInput(key,v){
  if(v.trim())my.notes[key]=v; else delete my.notes[key];
  persist(false); renderMy();
}
function pickPhase(b){document.querySelectorAll('#f-phase .pp').forEach(x=>x.classList.toggle('on',x===b));}
function saveCustom(id){
  const name=document.getElementById('f-name').value.trim();
  if(!name){document.getElementById('f-err').textContent='צריך לכתוב שם למשימה';return;}
  const pi=+document.querySelector('#f-phase .pp.on').dataset.i;
  const note=document.getElementById('f-note').value.trim();
  let c=id?my.custom.find(x=>x.id===id):null;
  if(c){c.name=name;c.pi=pi;}
  else{c={id:Date.now().toString(36)+Math.random().toString(36).slice(2,6),name,pi};my.custom.push(c);collapsed.delete(pi);}
  if(note)my.notes['c-'+c.id]=note; else delete my.notes['c-'+c.id];
  persist(true); closeDrawer(); renderMy();
  toast(id?'המשימה עודכנה':'המשימה נוספה');
}
function delCustom(id){
  if(!confirm('למחוק את המשימה?'))return;
  my.custom=my.custom.filter(x=>x.id!==id);
  delete my.status['c-'+id]; delete my.notes['c-'+id];
  persist(true); closeDrawer(); renderMy(); toast('המשימה נמחקה');
}
function resetCycle(){
  if(!confirm('לאפס את כל הסימונים וההערות למחזור חדש?\nהמשימות שהוספת יישארו ברשימה.'))return;
  my.status={}; my.notes={};
  persist(true); renderMy(); toast('הסימונים אופסו');
}
function setUser(n){
  const name=(n!=null?n:document.getElementById('f-user').value).trim().replace(/\s+/g,' ');
  if(!name){document.getElementById('u-err').textContent='צריך לכתוב שם';return;}
  user=name; lsSet('mm_user',user);
  lsSet('mm_recent',[user,...lsGet('mm_recent',[]).filter(x=>x!==user)].slice(0,5));
  my=loadLocal(); subscribe();
  if(history.state&&history.state.dr){try{history.replaceState({v:'my'},'');}catch(e){}}
  viewNow='';apply({v:'my'});
}
function changeUser(){openSheet({type:'name'});}
function toggleGrp(pi){collapsed.has(pi)?collapsed.delete(pi):collapsed.add(pi);renderMy();}
function setFilter(f){filter=f;renderMy();}

function toast(msg){
  const t=document.getElementById('toast'); t.textContent=msg; t.classList.add('on');
  clearTimeout(toastT); toastT=setTimeout(()=>t.classList.remove('on'),1800);
}

    await loadScript('https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js');
    firebase.initializeApp(FIREBASE_CONFIG);
    db=firebase.firestore();
    if(user)subscribe(); else setCloud('on');
  }catch(e){console.warn('cloud unavailable',e);setCloud('local');}
}
const docRef=()=>db.collection(COL).doc(encodeURIComponent(user));
function subscribe(){
  if(unsub){unsub();unsub=null;}
  if(!db||!user)return;
  setCloud('connecting');
  const who=user;
  unsub=docRef().onSnapshot(snap=>{
    if(who!==user)return;
    if(snap.metadata.hasPendingWrites)return;
    if(!snap.exists){if(my.updatedAt)pushCloud();setCloud('on');return;}
    const remote=normalize(snap.data());
    if(remote.updatedAt>my.updatedAt){
      my=remote; lsSet('mm_data_'+user,my);
      if(viewNow==='my')renderMy(); else renderHome();
    }else if(remote.updatedAt<my.updatedAt){pushCloud();}
    setCloud('on');
  },err=>{console.warn('cloud error',err);setCloud('local');});
}
function pushCloud(){
  if(!db||!user)return;
  docRef().set(JSON.parse(JSON.stringify(my))).then(()=>setCloud('on')).catch(e=>{console.warn(e);setCloud('local');});
}

// ─── MY TASKS: RENDER ──────────────────────────────────────────────────
function ring(pct){
  const r=34,c=2*Math.PI*r;
  return `<svg class="ring" viewBox="0 0 80 80"><circle cx="40" cy="40" r="${r}" class="ring-bg"/><circle cx="40" cy="40" r="${r}" class="ring-fg" stroke-dasharray="${c}" stroke-dashoffset="${c*(1-pct)}"/></svg>`;
}
function renderMy(){
  const el=document.getElementById('my-body');
  if(!user){
    el.innerHTML=`<div class="empty"><div class="dr-ic">${ic('user')}</div><h3>המשימות שלי</h3><p>כדי לסמן משימות ולשמור אותן בענן, צריך להיכנס עם השם שלך.</p>
      <button class="btn btn-primary" onclick="openSheet({type:'name'})">כניסה עם שם</button></div>`;
    document.getElementById('fab').classList.remove('on');
    renderHome(); return;
  }
  const all=items(), c=counts(all), pct=c.total?c.done/c.total:0;
  const match=x=>{const s=my.status[x.key]||'';return filter==='all'||(filter==='open'&&!s)||(filter==='done'&&s==='done')||(filter==='no'&&s==='no');};
  const groups=[...phases.map((_,i)=>i),-1].map(pi=>{
    const p=phaseMeta(pi);
    const list=all.filter(x=>x.pi===pi), gc=counts(list), shown=list.filter(match);
    if(pi<0&&!list.length)return '';
    if(filter!=='all'&&!shown.length)return '';
    const rows=shown.map(x=>{
      const s=my.status[x.key]||'', note=my.notes[x.key];
      const fq=x.custom?null:freqOf(x.t);
      return `<div class="row ${s?'st-'+s:''}">
        <button class="row-main" onclick="openSheet({type:'task',key:'${x.key}'})">
          <span class="row-name">${esc(x.name)}${x.custom?'<span class="mine">שלי</span>':''}</span>
          ${fq||note?`<span class="row-meta">${fq?`<span class="freq-mini" style="--fc:${fq.c}"><i></i>${fq.text}</span>`:''}${note?`<span class="row-note">${ic('note')}${esc(note)}</span>`:''}</span>`:''}
        </button>
        <div class="seg" role="group" aria-label="סטטוס">
          <button class="sb ok ${s==='done'?'on':''}" onclick="setStatus('${x.key}','done')" aria-pressed="${s==='done'}">${ic('check')}בוצע</button>
          <button class="sb no ${s==='no'?'on':''}" onclick="setStatus('${x.key}','no')" aria-pressed="${s==='no'}">${ic('x')}לא בוצע</button>
        </div>
      </div>`;
    }).join('');
    const col=collapsed.has(pi)&&filter==='all';
    return `<section class="grp ${col?'col':''}" style="--pc:${p.c}">
      <button class="grp-h" onclick="toggleGrp(${pi})">
        <span class="grp-ic">${ic(p.icon)}</span>
        <span class="grp-t"><b>${p.title}</b><small>${p.desc}</small></span>
        <span class="grp-n">${gc.done}/${gc.total}</span>
        <span class="grp-bar"><i style="width:${gc.total?gc.done/gc.total*100:0}%"></i></span>
        <span class="grp-chev">${ic('chev-d')}</span>
      </button>
      <div class="grp-list">${rows}<button class="row-add" onclick="openSheet({type:'add',pi:${pi}})">${ic('plus')}${pi<0?'הוספת משימה':'הוספת משימה לשלב'}</button></div>
    </section>`;
  }).join('');
  const fl=[['all','הכול',c.total],['open','פתוחות',c.open],['done','בוצעו',c.done],['no','לא בוצעו',c.no]];
  el.innerHTML=`
    <div class="my-head">
      <div><div class="ph-kicker" style="--pc:var(--accent)">המשימות שלי</div><h2>${esc(user)}</h2></div>
      <div class="my-user"><span class="cloud ${cloud}"><i></i>${cloudText()}</span><button class="link-btn" onclick="changeUser()">החלפת משתמש</button></div>
    </div>
    <div class="sum">
      <div class="sum-ring">${ring(pct)}<b>${Math.round(pct*100)}%</b></div>
      <div class="sum-txt"><div class="sum-big">${c.done} מתוך ${c.total} בוצעו</div>
        <div class="sum-row"><span class="k ok"><i></i>${c.done} בוצעו</span><span class="k no"><i></i>${c.no} לא בוצעו</span><span class="k op"><i></i>${c.open} פתוחות</span></div>
      </div>
    </div>
    <div class="toolbar">
      <div class="filters">${fl.map(([k,l,n])=>`<button class="fl ${filter===k?'on':''}" onclick="setFilter('${k}')">${l}<span>${n}</span></button>`).join('')}</div>
      <button class="btn btn-primary add-desk" onclick="openSheet({type:'add'})">${ic('plus')}משימה חדשה</button>
    </div>
    <div class="grps">${groups||'<div class="none">אין משימות בסינון הזה</div>'}</div>
    <div class="my-foot"><button class="link-btn danger" onclick="resetCycle()">${ic('reset')}איפוס מחזור</button></div>`;
  document.getElementById('fab').classList.toggle('on',viewNow==='my'||document.getElementById('my').classList.contains('on'));
  renderHome();
}

// ─── HOME: MY TASKS CARD ───────────────────────────────────────────────
const _renderHomeBase=renderHome;
renderHome=function(){
  _renderHomeBase();
  const box=document.getElementById('my-card'); if(!box)return;
  if(!user){
    box.innerHTML=`<div class="mc-ic">${ic('check-sq')}</div><div class="mc-t"><b>המשימות שלי</b><span>סמן מה בוצע בכל שלב, הוסף משימות משלך — נשמר בענן</span></div><span class="mc-go">${ic('arrow')}</span>`;
    return;
  }
  const c=counts(items()), pct=c.total?c.done/c.total:0;
  box.innerHTML=`<div class="mc-ring">${ring(pct)}<b>${Math.round(pct*100)}%</b></div><div class="mc-t"><b>המשימות שלי</b><span>${esc(user)} · ${c.done} מתוך ${c.total} בוצעו${c.no?` · ${c.no} לא בוצעו`:''}</span></div><span class="mc-go">${ic('arrow')}</span>`;
};

renderHome();
try{history.replaceState({v:'home'},'');}catch(e){}
setView('home');
initCloud();

</script>
